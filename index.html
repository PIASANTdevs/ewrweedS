<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pzd.tv</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#000;--surface:#0d0d0f;--border:#232328;--text:#fff;--text-dim:#a1a1aa;--muted:#6b6b73;
    --accent:#5d528d;--accent-light:#7c6fb0;
    --radius:14px;--radius-lg:20px;
    --ease-smooth:cubic-bezier(.4,0,.2,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
  }
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;
    background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased}

  header{display:flex;align-items:center;gap:26px;padding:16px 32px;background:rgba(0,0,0,.85);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,.04);flex-shrink:0;z-index:100;position:relative}
  .logo{display:flex;align-items:center;gap:2px;font-size:22px;font-weight:800;letter-spacing:-.8px;
    cursor:pointer;flex-shrink:0;user-select:none;transition:transform .35s var(--ease-out)}
  .logo:hover{transform:scale(1.04)}
  .logo-pzd{color:#fff}
  .logo-dot{color:var(--accent);font-size:26px;margin:0 1px}
  .logo-tv{color:var(--accent-light)}

  .nav-search-wrap{position:relative;flex-shrink:0}
  .nav-search{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.06);border-radius:11px;width:220px;cursor:text;
    transition:background .3s var(--ease-smooth),border-color .3s var(--ease-smooth),box-shadow .3s var(--ease-smooth)}
  .nav-search:focus-within{background:rgba(93,82,141,.1);border-color:var(--accent);box-shadow:0 0 0 3px rgba(93,82,141,.15)}
  .nav-search svg{width:16px;height:16px;fill:var(--text-dim);flex-shrink:0}
  .nav-search input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;font-family:inherit;min-width:0}
  .nav-search input::placeholder{color:var(--muted)}

  .search-suggest{position:absolute;top:calc(100% + 6px);left:0;width:360px;
    background:#111114;border:1px solid var(--border);border-radius:12px;padding:6px;
    box-shadow:0 20px 60px rgba(0,0,0,.85);max-height:460px;overflow-y:auto;
    opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;
    transition:opacity .28s var(--ease-out),transform .32s var(--ease-out);z-index:200}
  .search-suggest.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
  .search-suggest__item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;cursor:pointer;
    transition:background .22s var(--ease-smooth)}
  .search-suggest__item:hover,.search-suggest__item.active{background:rgba(255,255,255,.08)}
  .search-suggest__logo{width:40px;height:56px;border-radius:8px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
    background:linear-gradient(135deg,var(--accent),var(--accent-light));
    color:#fff;font-weight:800;font-size:14px}
  .search-suggest__logo--wide{width:64px;height:36px}
  .search-suggest__logo img{position:absolute;inset:0;margin:auto;max-width:85%;max-height:85%;object-fit:contain}
  .search-suggest__info{min-width:0;flex:1}
  .search-suggest__name{font-size:14px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .search-suggest__group{font-size:11px;color:var(--muted);margin-top:2px}
  .search-suggest__empty{padding:14px 12px;font-size:13px;color:var(--muted);text-align:center}

  .nav-menu{display:flex;align-items:center;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
  .nav-menu::-webkit-scrollbar{display:none}
  .nav-item{padding:9px 16px;border-radius:11px;font-size:14px;font-weight:600;color:var(--text-dim);
    cursor:pointer;white-space:nowrap;background:transparent;border:none;font-family:inherit;
    transition:color .3s var(--ease-smooth),background .3s var(--ease-smooth),transform .3s var(--ease-out);
    flex-shrink:0}
  .nav-item:hover{color:#fff;background:rgba(255,255,255,.05)}
  .nav-item.active{background:#fff;color:#000;transform:translateY(-1px);
    box-shadow:0 6px 20px rgba(255,255,255,.12)}

  .header-back{display:flex;align-items:center;gap:8px;background:transparent;border:none;cursor:pointer;
    color:var(--text);font-size:14px;font-weight:600;padding:8px 14px;border-radius:10px;
    transition:background .25s var(--ease-smooth);font-family:inherit;flex-shrink:0}
  .header-back:hover{background:rgba(255,255,255,.06)}
  .header-back svg{width:18px;height:18px;fill:currentColor}

  .nav-profile{position:relative;flex-shrink:0}
  .nav-profile__btn{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:24px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);cursor:pointer;
    transition:background .28s var(--ease-smooth);font-family:inherit;color:inherit}
  .nav-profile__btn:hover{background:rgba(255,255,255,.09)}
  .nav-profile__avatar{width:30px;height:30px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-light));
    display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
  .nav-profile__label{font-size:13px;font-weight:600}
  .nav-profile__menu{position:absolute;top:calc(100% + 10px);right:0;min-width:240px;
    background:#111114;border:1px solid var(--border);border-radius:12px;padding:6px;
    box-shadow:0 20px 60px rgba(0,0,0,.8);
    opacity:0;transform:translateY(-10px) scale(.96);transform-origin:top right;pointer-events:none;
    transition:opacity .28s var(--ease-out),transform .32s var(--ease-out);z-index:200}
  .nav-profile.open .nav-profile__menu{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
  .nav-profile__item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;
    color:var(--text);font-size:14px;font-weight:500;cursor:pointer;border:none;background:transparent;
    width:100%;font-family:inherit;text-align:left;transition:background .2s var(--ease-smooth)}
  .nav-profile__item:hover{background:rgba(255,255,255,.06)}
  .nav-profile__item svg{width:16px;height:16px;fill:var(--text-dim);flex-shrink:0}
  .nav-profile__divider{height:1px;background:var(--border);margin:6px 8px}

  .profile-switcher{padding:6px 8px 4px}
  .profile-switcher__title{font-size:10px;color:var(--muted);text-transform:uppercase;
    letter-spacing:1px;font-weight:700;padding:0 6px 6px}
  .profile-switcher__row{display:flex;gap:8px;padding:0 2px}
  .profile-chip{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:8px 4px;border-radius:10px;cursor:pointer;background:rgba(255,255,255,.04);
    border:1px solid var(--border);
    transition:background .3s var(--ease-smooth),border-color .3s var(--ease-smooth);
    font-family:inherit;color:inherit}
  .profile-chip:hover{background:rgba(255,255,255,.08)}
  .profile-chip.active{background:rgba(93,82,141,.2);border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent)}
  .profile-chip__avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:12px;color:#fff}
  .profile-chip__label{font-size:11px;font-weight:600;color:var(--text-dim)}
  .profile-chip.active .profile-chip__label{color:#fff}

  main{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
  .view{flex:1;min-height:0;display:none;flex-direction:column}
  body.view-home #viewHome{display:flex}
  body.view-movie #viewMovie{display:flex}
  body.view-player #viewPlayer{display:flex}

  .scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#232328 transparent}
  .scroll::-webkit-scrollbar{width:10px}
  .scroll::-webkit-scrollbar-thumb{background:#232328;border-radius:6px}

  .hero{position:relative;height:620px;margin:0 0 44px;overflow:hidden;background:#000;cursor:pointer;
    animation:heroIn 1.1s var(--ease-out) backwards}
  @keyframes heroIn{from{opacity:0;transform:translateY(30px) scale(.99)}}
  .hero.fading .hero__bg,
  .hero.fading .hero__content,
  .hero.fading .hero__video,
  .hero.fading .hero__video-dim,
  .hero.fading .hero__bg-grad,
  .hero.fading .hero__trailer{opacity:0 !important;transition:opacity .7s var(--ease-smooth)}
  .hero__video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;
    filter:blur(30px) brightness(.42) saturate(150%);transform:scale(1.15);pointer-events:none;
    transition:opacity .8s var(--ease-smooth)}
  .hero__bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center top;
    filter:brightness(.6) saturate(120%);transform:scale(1.05);
    animation:heroBgIn 1.6s var(--ease-out) backwards;
    transition:opacity .8s var(--ease-smooth)}
  @keyframes heroBgIn{from{transform:scale(1.12)}to{transform:scale(1.05)}}
  .hero__trailer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;
    pointer-events:none;opacity:0;
    transition:opacity 1.2s var(--ease-smooth)}
  .hero__trailer.show{opacity:1}
  .hero__video-dim{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.1) 0%, rgba(0,0,0,.75) 100%),
      linear-gradient(90deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.35) 45%, rgba(0,0,0,.65) 100%);
    transition:opacity .8s var(--ease-smooth)}
  .hero__skeleton{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(90deg,#0f0f12 25%,#18181d 50%,#0f0f12 75%);
    background-size:200% 100%;animation:shimmer 1.8s infinite;opacity:1;transition:opacity .8s var(--ease-smooth)}
  .hero__skeleton.hidden{opacity:0}
  .hero__skeleton::after{content:'';position:absolute;top:50%;left:50%;width:56px;height:56px;
    margin:-28px 0 0 -28px;border-radius:50%;border:3px solid rgba(255,255,255,.1);
    border-top-color:var(--accent);animation:spin .9s linear infinite}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hero__bg-grad{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse 40% 80% at 0% 50%, rgba(93,82,141,.4), transparent 70%),
      radial-gradient(ellipse 40% 80% at 100% 50%, rgba(93,82,141,.4), transparent 70%);
    mix-blend-mode:screen;transition:opacity .8s var(--ease-smooth)}
  .hero__gradient{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(90deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.45) 40%,transparent 75%),
      linear-gradient(to top,rgba(0,0,0,.95) 0%,transparent 45%)}
  .hero__content{position:relative;z-index:4;height:100%;display:flex;flex-direction:column;
    justify-content:flex-end;padding:0 60px 60px;max-width:780px;
    transition:opacity .8s var(--ease-smooth)}
  .hero__content > *{animation:heroTextIn .9s var(--ease-out) backwards}
  .hero__content > *:nth-child(1){animation-delay:.1s}
  .hero__content > *:nth-child(2){animation-delay:.2s}
  .hero__content > *:nth-child(3){animation-delay:.3s}
  .hero__content > *:nth-child(4){animation-delay:.4s}
  .hero__content > *:nth-child(5){animation-delay:.5s}
  @keyframes heroTextIn{from{opacity:0;transform:translateY(24px)}}
  .hero__badges{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .hero__badge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:7px;
    background:var(--accent);color:#fff;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
  .hero__badge--live::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;
    box-shadow:0 0 10px #fff;animation:pulse 2s infinite}
  .hero__badge--soft{background:rgba(255,255,255,.12);color:#fff;text-transform:none;letter-spacing:0}
  .hero__badge--rating{background:rgba(74,222,128,.18);color:#4ade80}
  @keyframes pulse{50%{opacity:.4}}
  .hero__title{font-size:60px;font-weight:900;line-height:1.02;letter-spacing:-2px;margin-bottom:16px;
    text-shadow:0 4px 40px rgba(0,0,0,.85)}
  .hero__meta{display:flex;align-items:center;gap:12px;margin-bottom:16px;color:var(--text-dim);font-size:15px;flex-wrap:wrap}
  .hero__meta-tag{padding:3px 9px;border-radius:5px;background:rgba(255,255,255,.12);
    font-size:11px;font-weight:700;color:#fff;letter-spacing:.5px}
  .hero__meta-sep{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.25)}
  .hero__desc{font-size:16px;line-height:1.55;color:#d1d1d6;margin-bottom:24px;max-width:620px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .hero__actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .hero__btn{padding:15px 36px;border-radius:13px;border:none;font-size:15px;font-weight:700;
    font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:10px;
    transition:transform .3s var(--ease-out),background .28s var(--ease-smooth),box-shadow .3s var(--ease-smooth)}
  .hero__btn:active{transform:scale(.96)}
  .hero__btn svg{width:20px;height:20px;fill:currentColor}
  .hero__btn--primary{background:#fff;color:#000}
  .hero__btn--primary:hover{background:#e5e5e5;box-shadow:0 14px 40px rgba(255,255,255,.15);transform:translateY(-2px)}
  .hero__btn--accent{background:var(--accent);color:#fff}
  .hero__btn--accent:hover{background:var(--accent-light);box-shadow:0 14px 40px rgba(93,82,141,.5);transform:translateY(-2px)}
  .hero__btn--ghost{background:rgba(255,255,255,.12);color:#fff;backdrop-filter:blur(10px)}
  .hero__btn--ghost:hover{background:rgba(255,255,255,.2);transform:translateY(-2px)}
  .hero__btn--icon{padding:15px;width:52px;justify-content:center}
  .hero__dots{position:absolute;bottom:32px;right:60px;display:flex;gap:6px;z-index:5}
  .hero__dot{width:28px;height:3px;border-radius:2px;background:rgba(255,255,255,.25);
    cursor:pointer;border:none;padding:0;
    transition:background .4s var(--ease-smooth),width .5s var(--ease-out)}
  .hero__dot.active{background:#fff;width:48px}

  .cats-wrap{position:relative;flex-shrink:0}
  .cats-wrap::before,.cats-wrap::after{content:'';position:absolute;top:0;bottom:20px;width:36px;
    pointer-events:none;z-index:2}
  .cats-wrap::before{left:0;background:linear-gradient(to right,#000,transparent)}
  .cats-wrap::after{right:0;background:linear-gradient(to left,#000,transparent)}
  .cats{display:flex;gap:8px;padding:0 60px 22px;overflow-x:auto;scrollbar-width:none;
    flex-shrink:0;scroll-behavior:smooth}
  .cats::-webkit-scrollbar{display:none}
  .cat{padding:8px 18px;border-radius:22px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.06);color:var(--text-dim);font-size:13px;font-weight:600;
    cursor:pointer;font-family:inherit;white-space:nowrap;
    transition:background .3s var(--ease-smooth),color .3s var(--ease-smooth),
      border-color .3s var(--ease-smooth),transform .3s var(--ease-out);flex-shrink:0}
  .cat:hover{color:#fff;background:rgba(255,255,255,.09);transform:translateY(-2px)}
  .cat.active{background:var(--accent);color:#fff;border-color:transparent;
    box-shadow:0 6px 20px rgba(93,82,141,.4)}
  .cat.active:hover{background:var(--accent-light)}

  .rows{padding:0 0 80px}
  .row{margin-bottom:44px;animation:rowIn .9s var(--ease-out) backwards;position:relative}
  @keyframes rowIn{from{opacity:0;transform:translateY(40px)}}
  .row-head{display:flex;align-items:center;justify-content:space-between;padding:0 60px 14px}
  .row-title{font-size:23px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:10px;
    transition:color .3s var(--ease-smooth)}
  .row-count{font-size:11px;font-weight:600;color:var(--muted);padding:3px 9px;border-radius:6px;
    background:rgba(255,255,255,.04)}
  .row-scroll-wrap{position:relative}
  .row-scroll{display:flex;gap:14px;padding:4px 60px 16px;overflow-x:auto;overflow-y:hidden;
    scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .row-scroll::-webkit-scrollbar{display:none}
  .row-arrow{position:absolute;top:0;bottom:16px;width:54px;z-index:5;
    background:linear-gradient(to right,rgba(0,0,0,.9),rgba(0,0,0,.4) 60%,transparent);
    border:none;cursor:pointer;opacity:0;
    transition:opacity .4s var(--ease-smooth);
    display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
  .row-arrow--right{right:0;background:linear-gradient(to left,rgba(0,0,0,.9),rgba(0,0,0,.4) 60%,transparent)}
  .row-arrow--left{left:0}
  .row:hover .row-arrow{opacity:1}
  .row-arrow svg{width:30px;height:30px;fill:#fff;
    transition:transform .35s var(--ease-out);filter:drop-shadow(0 2px 8px rgba(0,0,0,.8))}
  .row-arrow:hover svg{transform:scale(1.2)}

  .tile{flex:0 0 auto;width:240px;cursor:pointer;user-select:none;position:relative;
    transition:transform .45s var(--ease-out);animation:tileIn .7s var(--ease-out) backwards}
  @keyframes tileIn{from{opacity:0;transform:translateY(24px) scale(.96)}}
  .tile:hover{transform:translateY(-8px)}
  .tile-card{position:relative;aspect-ratio:16/9;border-radius:var(--radius);background:var(--surface);
    border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    transition:border-color .4s var(--ease-smooth),box-shadow .45s var(--ease-out),transform .45s var(--ease-out)}
  .tile:hover .tile-card{border-color:rgba(93,82,141,.7);
    box-shadow:0 24px 60px rgba(0,0,0,.7),0 0 0 1px rgba(93,82,141,.5),0 0 40px rgba(93,82,141,.25)}
  .tile-num{position:absolute;top:10px;left:10px;z-index:3;padding:3px 8px;border-radius:5px;
    background:rgba(0,0,0,.55);backdrop-filter:blur(8px);font-size:10px;font-weight:700;
    color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.05);
    opacity:0;transform:translateY(-4px);transition:opacity .3s var(--ease-smooth),transform .35s var(--ease-out);
    pointer-events:none}
  .tile:hover .tile-num{opacity:1;transform:translateY(0)}
  .tile-fav{position:absolute;bottom:10px;right:10px;z-index:4;width:34px;height:34px;border-radius:9px;
    background:rgba(0,0,0,.75);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);
    display:grid;place-items:center;cursor:pointer;padding:0;
    opacity:0;transform:translateY(6px) scale(.9);
    transition:opacity .3s var(--ease-smooth),transform .4s var(--ease-out)}
  .tile:hover .tile-fav{opacity:1;transform:translateY(0) scale(1)}
  .tile-fav:hover{background:rgba(93,82,141,.45);border-color:rgba(93,82,141,.9);transform:scale(1.12)}
  .tile-fav.active{opacity:1;transform:translateY(0) scale(1);
    background:rgba(93,82,141,.45);border-color:rgba(93,82,141,.9)}
  .tile-fav svg{width:16px;height:16px;fill:rgba(255,255,255,.75)}
  .tile-fav.active svg{fill:#fff}
  .logo-stack{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:20px;pointer-events:none}
  .logo-badge{width:70px;height:70px;border-radius:16px;display:grid;place-items:center;
    color:#fff;font-weight:900;font-size:26px;letter-spacing:-1px;
    background:linear-gradient(135deg,var(--accent),var(--accent-light));
    box-shadow:0 12px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15)}
  .logo-img{max-width:100%;max-height:100%;object-fit:contain;display:block;
    filter:drop-shadow(0 8px 24px rgba(0,0,0,.6))}
  .logo-img.hidden{display:none}
  .tile-info{padding:10px 4px 0}
  .tile-name{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:color .3s var(--ease-smooth)}
  .tile:hover .tile-name{color:var(--accent-light)}
  .tile-meta{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .card{flex:0 0 auto;width:210px;cursor:pointer;user-select:none;position:relative;
    transition:transform .5s var(--ease-out);animation:tileIn .7s var(--ease-out) backwards}
  .card:hover{transform:translateY(-10px)}

  .card-poster{position:relative;aspect-ratio:2/3;border-radius:var(--radius);background:var(--surface);
    border:1px solid rgba(255,255,255,.06);overflow:hidden;
    transition:border-color .4s var(--ease-smooth),box-shadow .5s var(--ease-out)}
  .card:hover .card-poster{border-color:rgba(93,82,141,.7);
    box-shadow:0 30px 70px rgba(0,0,0,.75),0 0 0 1px rgba(93,82,141,.5),0 0 50px rgba(93,82,141,.3)}

   ИСТОЧНИКИ ВИДЕО (Apple CMS V10)
   ========================================================= */
const VIDEO_SOURCES = [
  { id:'heimuer', name:'Heimuer', api:'https://json.heimuer.xyz/api.php/provide/vod' },
  { id:'wujin',   name:'Wujin',   api:'https://api.wujinapi.me/api.php/provide/vod' },
  { id:'rycj',    name:'Ruyi',    api:'https://cj.rycjapi.com/api.php/provide/vod' },
  { id:'dytt',    name:'DyTT',    api:'https://caiji.dyttzyapi.com/api.php/provide/vod' },
  { id:'wolong',  name:'Wolong',  api:'https://collect.wolongzyw.com/api.php/provide/vod' }
];

/* Публичный CORS-прокси. Для продакшена замените на свой /api/proxy?url= */
const CORS_PROXY = 'https://api.allorigins.win/raw?url=';
function proxyUrl(u){ return CORS_PROXY + encodeURIComponent(u); }

async function searchByQuery(query, sources = VIDEO_SOURCES){
  const tasks = sources.map(async (src) => {
    const u = `${src.api}?ac=videolist&wd=${encodeURIComponent(query)}`;
    try {
      const r = await fetch(proxyUrl(u), { cache:'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      if (!data || !data.list) return [];
      return data.list.map(v => ({
        sourceId: src.id,
        sourceName: src.name,
        vod_id: v.vod_id,
        title: v.vod_name || 'Без названия',
        poster: v.vod_pic || '',
        year: parseInt(v.vod_year, 10) || 0,
        genres: (v.vod_class || '').split(',').map(s => s.trim()).filter(Boolean),
        description: (v.vod_content || v.vod_blurb || '').replace(/<[^>]+>/g,'').trim(),
        rating: parseFloat(v.vod_score) || 0
      }));
    } catch (e) {
      console.warn('[' + src.id + ']', e.message);
      return [];
    }
  });
  const results = await Promise.all(tasks);
  return results.flat();
}

async function getPlayUrl(sourceId, vodId){
  const src = VIDEO_SOURCES.find(s => s.id === sourceId);
  if (!src) return null;
  const u = `${src.api}?ac=detail&ids=${vodId}`;
  try {
    const r = await fetch(proxyUrl(u), { cache:'no-store' });
    const data = await r.json();
    const item = data && data.list && data.list[0];
    if (!item || !item.vod_play_url) return null;
    const first = item.vod_play_url.split('#')[0];
    const parts = first.split('$');
    return parts[1] || null;
  } catch (e) {
    console.warn(e);
    return null;
  }
}

async function playFromApi(vodItem){
  showToast('Ищу источник…');
  const url = await getPlayUrl(vodItem.sourceId, vodItem.vod_id);
  if (!url){
    showToast('Не удалось получить ссылку на видео');
    return;
  }
  const synthetic = {
    id: 'api:' + vodItem.sourceId + ':' + vodItem.vod_id,
    title: vodItem.title,
    poster: vodItem.poster,
    backdrop: vodItem.poster,
    year: vodItem.year,
    duration: 0,
    age: '16+',
    rating: vodItem.rating || 7.0,
    genres: vodItem.genres.length ? vodItem.genres : ['Кино'],
    description: vodItem.description || 'Описание отсутствует.',
    url: url,
    userAgent: '',
    isApi: true,
    sourceName: vodItem.sourceName
  };
  openPlayer('movie', synthetic);
}

function monogramOf(name){
  const n = (name||'').trim();
  const clean = n.replace(/^[\s.\-_+|#@!*]+/,'').trim();
  if (!clean) return '?';
  const words = clean.split(/\s+/);
  if (words.length >= 2){
    const a = words[0].match(/[A-Za-zА-Яа-я0-9]/);
    const b = words[1].match(/[A-Za-zА-Яа-я0-9]/);
    if (a && b) return (a[0]+b[0]).toUpperCase();
    if (a) return a[0].toUpperCase();
  }
  const m = clean.match(/[A-Za-zА-Яа-я0-9]/g);
  if (!m) return '?';
  if (clean.length <= 3 && m.length >= 2) return (m[0]+m[1]).toUpperCase();
  return m[0].toUpperCase();
}

const TRANSLIT = {
  'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y',
  'к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f',
  'х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya',
  ' ':'_','-':'_','.':'_','/':'_','+':'_'

function translit(str){
  str = (str||'').toLowerCase().replace(/ё/g,'е');
  str = str.replace(/\(.*?\)/g,'').replace(/\bhd\b|\bfhd\b|\buhd\b|\b4k\b|\bsd\b|\bhevc\b/g,'').trim();
  let out = '';
  for (const ch of str){
    if (TRANSLIT[ch] !== undefined) out += TRANSLIT[ch];
    else if (/[a-z0-9]/.test(ch)) out += ch;
  }
  return out.replace(/_+/g,'_').replace(/^_|_$/g,'');
}

function parseM3U(text){
  const out = [];
  let cur = null, ua = '';
  for (const raw of text.split(/\r?\n/)){
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF')){
      const gm = line.match(/group-title="([^"]*)"/);
      const lm = line.match(/tvg-logo="([^"]*)"/);
      const im = line.match(/tvg-id="([^"]*)"/);
      const ci = line.lastIndexOf(',');
      cur = { name: ci >= 0 ? line.slice(ci+1).trim() : 'Канал',
        group: normalizeGroup(gm ? gm[1] : ''),
        tvgLogo: lm ? lm[1] : '',
        tvgId: im ? im[1] : '',
        url:'', userAgent:'', isDash:false };
    } else if (line.startsWith('#EXTVLCOPT')){
      const m = line.match(/http-user-agent="?([^"\s]+)"?/);
      if (m) ua = m[1];
    } else if (line.startsWith('#')){
      continue;
    } else if (cur){
      cur.url = line;
      cur.isDash = /\.mpd(\?|$)/i.test(line);
      if (ua) cur.userAgent = ua;
      ua = '';
      if (/^https?:\/\//.test(line)) out.push(cur);
      cur = null;
    }
  }
  return out;
}
function isBannedGroup(g){
  const gg = (g||'').toLowerCase();
  return BANNED_GROUPS.some(k => gg.includes(k.toLowerCase()));
}
function normForDedup(name){
  return (name||'').toLowerCase().replace(/ё/g,'е')
    .replace(/\b(hd|fhd|uhd|4k|8k|1080p?|720p?|480p?|sd|hevc|h265|h264|avc)\b/gi,'')
    .replace(/[^\wа-я\s]/gi,' ').replace(/\s+/g,' ').trim();
}
function normUrl(u){
  try { const x = new URL(u); return (x.host+x.pathname).toLowerCase().replace(/\/+$/,''); }
  catch(e){ return (u||'').toLowerCase().split('?')[0].replace(/\/+$/,''); }
}
function chScore(c){
  let s = 0;
  if (c.tvgLogo) s += 5;
  const n = (c.name||'').toLowerCase();
  if (/\b(4k|uhd)\b/.test(n)) s += 10;
  else if (/\b(1080|fhd)\b/.test(n)) s += 6;
  else if (/\b(hd|720)\b/.test(n)) s += 3;
  if (/\b(sd|480|360)\b/.test(n)) s -= 2;
  return s;
}
function dedupChannels(all){
  const byId = new Map(), byUrl = new Map(), result = [], byName = new Map();
  for (const ch of all){
    const idKey = (ch.tvgId||'').toLowerCase().trim();
    const urlKey = normUrl(ch.url);
    const nameKey = normForDedup(ch.name);
    if (idKey && byId.has(idKey)){
      const old = byId.get(idKey);
      if (chScore(ch) > chScore(old)){ const i = result.indexOf(old); if (i >= 0) result[i] = ch; byId.set(idKey, ch); }
      continue;
    }
    if (urlKey && byUrl.has(urlKey)){
      const old = byUrl.get(urlKey);
      if (chScore(ch) > chScore(old)){ const i = result.indexOf(old); if (i >= 0) result[i] = ch; byUrl.set(urlKey, ch); }
      continue;
    }
    let dup = false;
    if (nameKey.length >= 4){
      const cands = byName.get(nameKey);
      if (cands){
        for (const i of cands){
          const other = result[i];
          if (other && other.group === ch.group){
            const na = normForDedup(other.name);
            if (na === nameKey || (na.length >= 4 && (na.includes(nameKey) || nameKey.includes(na)))){
              if (chScore(ch) > chScore(other)) result[i] = ch;
              dup = true; break;
            }
          }
        }
      }
    }
    if (dup) continue;
    const idx = result.length;
    result.push(ch);
    if (idKey) byId.set(idKey, ch);
    if (urlKey) byUrl.set(urlKey, ch);
    if (nameKey){ if (!byName.has(nameKey)) byName.set(nameKey, []); byName.get(nameKey).push(idx); }
  }
  return result;
}

function getEPG(ch){
  const pool = EPG_POOL[ch.group] || ['Программа','Эфир','Передача','Шоу'];
  let h = 0;
  for (let i = 0; i < ch.name.length; i++) h = (h*31 + ch.name.charCodeAt(i))|0;
  return pool[Math.abs(h + new Date().getHours()) % pool.length];
}

        else openPlayer('movie', item.data);
      } else if (act === 'more'){
        if (item.type === 'movie') openMoviePage(item.data);
      } else if (act === 'fav'){
        const k = item.type === 'channel' ? channelKey(item.data) : movieKey(item.data);
        const now = toggleFav(k);
        showToast(now ? 'В избранное' : 'Убрано');
        renderHome();
      }
    });
  });
  block.addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    if (item.type === 'channel') openPlayer('channel', item.data);
    else openMoviePage(item.data);
  });
  block.querySelectorAll('.hero__dot').forEach(d => {
    d.addEventListener('click', (e) => {
      e.stopPropagation();
      heroIdx = parseInt(d.dataset.i, 10);
      renderHeroSlide();
    });
  });
  if (item.type === 'channel') loadHeroVideo(item.data);
  if (item.type === 'movie') startHeroTrailer();
}

function loadHeroVideo(ch){
  const v = $('heroContainer')?.querySelector('.hero__video');
  const skel = $('heroContainer')?.querySelector('.hero__skeleton');
  if (!v || !ch.url){ if (skel) skel.classList.add('hidden'); return; }
  if (heroHls){ try { heroHls.destroy(); } catch(e){} heroHls = null; }
  try { v.removeAttribute('src'); v.load(); } catch(e){}
  v.muted = true;
  const hide = () => { if (skel) skel.classList.add('hidden'); };
  v.addEventListener('playing', hide, { once:true });
  v.addEventListener('loadeddata', () => setTimeout(hide, 400), { once:true });
  if (window.Hls && Hls.isSupported()){
    heroHls = new Hls({ enableWorker:true, lowLatencyMode:true, maxBufferLength:8, backBufferLength:0 });
    heroHls.loadSource(ch.url);
    heroHls.attachMedia(v);
    heroHls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(()=>{}));
    heroHls.on(Hls.Events.ERROR, (e, d) => {
      if (d.fatal){ try { heroHls.destroy(); } catch(e){} heroHls = null; if (skel) skel.classList.add('hidden'); }
    });
  } else if (v.canPlayType('application/vnd.apple.mpegurl')){
    v.src = ch.url; v.play().catch(()=>{});
  } else { if (skel) skel.classList.add('hidden'); }
}

function startHeroTrailer(){
  clearTimeout(heroTrailerTimer);
  const v = $('heroContainer')?.querySelector('.hero__trailer');
  if (!v) return;
  const src = v.dataset.src;
  if (!src) return;
  heroTrailerTimer = setTimeout(() => {
    if (!document.body.contains(v)) return;
    v.src = src;
    v.muted = true;
    v.volume = 0;
    v.play().then(() => v.classList.add('show')).catch(()=>{});
  }, 2500);
}

function stopHero(){
  clearInterval(heroTimer);
  clearTimeout(heroTrailerTimer);
  if (heroHls){ try { heroHls.destroy(); } catch(e){} heroHls = null; }
}

function buildRow(title, items, delay=0){
  const row = create('div');
  row.className = 'row';
  row.style.animationDelay = delay + 'ms';
  row.innerHTML = `
    <div class="row-head">
      <div class="row-title">${title}</div>
      <div class="row-count">${items.length}</div>
    </div>
    <div class="row-scroll-wrap">
      <button class="row-arrow row-arrow--left">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <div class="row-scroll"></div>
      <button class="row-arrow row-arrow--right">
        <svg viewBox="0 0 24 24"><path d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
      </button>
    </div>
  `;
  const sc = row.querySelector('.row-scroll');
  const L = row.querySelector('.row-arrow--left');
  const R = row.querySelector('.row-arrow--right');
  items.forEach((it, i) => {
    if (it.type === 'channel') sc.appendChild(channelTile(it.data, i, Math.min(i*28,350)));
    else sc.appendChild(movieCard(it.data, Math.min(i*28,350)));
  });
  const updateArrows = () => {
    const max = sc.scrollWidth - sc.clientWidth;
    if (max <= 10){ L.style.display = 'none'; R.style.display = 'none'; return; }
    L.style.display = sc.scrollLeft > 10 ? 'flex' : 'none';
    R.style.display = sc.scrollLeft < max - 10 ? 'flex' : 'none';
  };
  const scrollBy = (d) => {
    const amount = Math.max(400, Math.min(sc.clientWidth - 80, 720));
    sc.scrollBy({ left: d * amount, behavior: 'smooth' });
  };
  L.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); scrollBy(-1); });
  R.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); scrollBy(1); });
  sc.addEventListener('scroll', updateArrows, { passive: true });
  requestAnimationFrame(updateArrows);
  setTimeout(updateArrows, 400);
  return row;
}

function moviesForSection(sec){
  if (sec === 'movies') return MOVIES.filter(m => m.section === 'movie');
  if (sec === 'series') return MOVIES.filter(m => m.section === 'series');
  if (sec === 'kids')   return MOVIES.filter(m => m.section === 'kids');
  if (sec === 'shows')  return MOVIES.filter(m => m.section === 'show');
  if (sec === 'sport')  return MOVIES.filter(m => m.section === 'sport');
  return MOVIES;
}

function renderHome(){
  if (activeSection === 'tv') return renderTvHome();

  const isHome = activeSection === 'home';
  const source = isHome ? MOVIES : moviesForSection(activeSection);
  if (!source.length && !isHome){
    $('heroContainer').innerHTML = '';
    $('chips').innerHTML = '';
    $('rows').innerHTML = '<div style="padding:80px 60px;color:var(--muted);text-align:center;font-size:15px">Раздел скоро появится</div>';
    return;
  }

  const pool = isHome ? MOVIES
    : (activeGenre === 'Все' ? source : source.filter(m => m.genres.includes(activeGenre)));
  const heroPool = (pool.length ? pool : source).slice().sort(() => Math.random() - 0.5).slice(0, 5);
  heroItems = heroPool.map(m => ({ type:'movie', data:m }));
  heroIdx = 0;
  renderHeroSlide();
  clearInterval(heroTimer);
  heroTimer = setInterval(() => {
    if (document.body.classList.contains('view-home') && activeSection !== 'tv' && !document.querySelector('.hero:hover')){
      heroIdx = (heroIdx + 1) % heroItems.length;
      renderHeroSlide();
    }
  }, 9000);

  const cats = ['Все', ...new Set(source.flatMap(m => m.genres))];
  renderChips(cats);

  const q = $('search').value.trim().toLowerCase();
  const list = pool.filter(m => {
    if (q && !m.title.toLowerCase().includes(q) && !m.genres.join(' ').toLowerCase().includes(q)) return false;
    return true;
  });

  const rowsEl = $('rows');
  rowsEl.innerHTML = '';
  let delay = 0;

  if (!q && activeGenre === 'Все'){
    const favM = getFavorites().filter(k => k.startsWith('m:')).map(k => MOVIES.find(m => movieKey(m) === k)).filter(Boolean);
    if (favM.length){ rowsEl.appendChild(buildRow('Избранное', favM.map(m => ({type:'movie',data:m})), delay)); delay += 90; }

    const top = [...source].sort((a,b) => b.rating - a.rating).slice(0, 12);
    if (top.length){ rowsEl.appendChild(buildRow('Топ рейтинга', top.map(m => ({type:'movie',data:m})), delay)); delay += 90; }

    const fresh = [...source].sort((a,b) => b.year - a.year).slice(0, 12);
    if (fresh.length){ rowsEl.appendChild(buildRow('Новинки', fresh.map(m => ({type:'movie',data:m})), delay)); delay += 90; }

    if (isHome){
      const s = MOVIES.filter(m => m.section === 'series');
      if (s.length){ rowsEl.appendChild(buildRow('Сериалы', s.map(m => ({type:'movie',data:m})), delay)); delay += 90; }

      const k = MOVIES.filter(m => m.section === 'kids');
      if (k.length){ rowsEl.appendChild(buildRow('Детям', k.map(m => ({type:'movie',data:m})), delay)); delay += 90; }

      const sh = MOVIES.filter(m => m.section === 'show');
      if (sh.length){ rowsEl.appendChild(buildRow('Шоу', sh.map(m => ({type:'movie',data:m})), delay)); delay += 90; }

      if (channelsLoaded){
        const fed = channels.filter(c => c.group === 'Федеральные').slice(0, 12);
        if (fed.length){ rowsEl.appendChild(buildRow('ТВ: Федеральные', fed.map(c => ({type:'channel',data:c})), delay)); delay += 90; }
      }
    }
  }

  if (list.length){
    const byGenre = {};
    list.forEach(m => m.genres.forEach(g => { (byGenre[g] = byGenre[g] || []).push(m); }));
    const sorted = Object.keys(byGenre).sort((a,b) => byGenre[b].length - byGenre[a].length);
    sorted.forEach(g => {
      rowsEl.appendChild(buildRow(escapeHtml(g), byGenre[g].map(m => ({type:'movie',data:m})), delay));
      delay += 70;
    });
  }
  wireLogos(rowsEl);
}

function renderTvHome(){
  if (!channelsLoaded){
    $('heroContainer').innerHTML = '<div class="hero" style="background:linear-gradient(90deg,#0f0f12 25%,#18181d 50%,#0f0f12 75%);background-size:200% 100%;animation:shimmer 1.8s infinite"></div>';

  const pool = activeGenre === 'Все'
    ? channels.filter(c => ['Федеральные','Кино','Новости'].includes(c.group))
    : channels.filter(c => c.group === activeGenre);

  heroItems = heroPool.map(c => ({ type:'channel', data:c }));
  heroIdx = 0;

      heroIdx = (heroIdx + 1) % heroItems.length;
      renderHeroSlide();
    }
  }, 12000);

  const cats = ['Все', ...new Set(channels.map(c => c.group))];
  renderChips(cats);

  const rowsEl = $('rows');
  rowsEl.innerHTML = '';
  let delay = 0;
  const q = $('search').value.trim().toLowerCase();

  const list = channels.filter(c => {
    if (activeGenre !== 'Все' && c.group !== activeGenre) return false;
    if (q && !c.name.toLowerCase().includes(q) && !c.group.toLowerCase().includes(q)) return false;
    return true;
  });

  const groups = {};
  list.forEach(c => { (groups[c.group] = groups[c.group] || []).push(c); });
  const sorted = Object.keys(groups).sort((a,b) => groups[b].length - groups[a].length);
  sorted.forEach(g => {
    rowsEl.appendChild(buildRow(escapeHtml(g), groups[g].map(c => ({type:'channel',data:c})), delay));
    delay += 70;
  });
  wireLogos(rowsEl);
}

function tickAmbient(){
  if (!ambientRunning) return;
  if (video.readyState >= 2 && video.videoWidth){
    try {
      ambientCtxInner.drawImage(video, 0, 0, ambientCanvasInner.width, ambientCanvasInner.height);
      ambientCtxOuter.drawImage(video, 0, 0, ambientCanvasOuter.width, ambientCanvasOuter.height);
    } catch(e){}
  }
  ambientRAF = requestAnimationFrame(tickAmbient);
}
function startAmbient(){ if (ambientRunning) return; ambientRunning = true; tickAmbient(); }
function stopAmbient(){ ambientRunning = false; if (ambientRAF){ cancelAnimationFrame(ambientRAF); ambientRAF = null; } }

function stopPlayer(){
  try { video.pause(); } catch(e){}
  try { video.muted = true; } catch(e){}
  if (hls){ try { hls.destroy(); } catch(e){} hls = null; }
  try {
    video.removeAttribute('src');
    video.srcObject = null;
    video.load();
  } catch(e){}
  stopAmbient();
  clearInterval(progressTimer);
  closeZap();
  currentPlaying = null;
}

function openPlayer(type, data){
  currentPlaying = { type, data, key: type === 'channel' ? channelKey(data) : movieKey(data) };
  setView('player');

  const isLive = type === 'channel';
  $('progressWrap').classList.toggle('hidden', isLive);
  $('timeRow').classList.toggle('hidden', isLive);
  $('qualityWrap').classList.toggle('hidden', isLive);
  $('nowType').textContent = isLive ? 'LIVE' : 'Фильм';
  $('nowType').className = 'now-type' + (isLive ? ' now-type--live' : '');

  if (isLive){
    $('nowName').textContent = data.name;
    $('nowMeta').textContent = data.group + ' · ' + getEPG(data);
    $('nowPoster').style.display = 'none';
    $('nowLogoBox').style.display = '';
    const logo = getChannelLogo(data);
    if (logo){
      $('nowLogoBox').innerHTML = `<span>${monogramOf(data.name)}</span><img src="${logo}" onload="this.previousElementSibling.style.display='none'" onerror="this.remove()">`;
    } else {
      $('nowLogoBox').innerHTML = monogramOf(data.name);
    }
    addToHistory(channelKey(data));
  } else {
    $('nowName').textContent = data.title;
    $('nowMeta').textContent = `${data.year||''} · ${data.sourceName || (data.genres&&data.genres[0]) || ''}`;
    $('nowPoster').style.display = '';
    if (data.poster){ $('nowPoster').style.backgroundImage = `url('${data.poster}')`; }
    $('nowLogoBox').style.display = 'none';
    addToHistory(movieKey(data));
  }

  loadStream(data.url, data.userAgent || '', !isLive);
  pokeUI();
  if (!isLive) startProgressSave();
}

function loadStream(url, ua, isMovie){
  $('playerError').classList.remove('show');
  $('playerLoader').classList.add('show');

  if (hls){ try { hls.destroy(); } catch(e){} hls = null; }
  video.removeAttribute('src');
  try { video.load(); } catch(e){}
  resetQuality();

  if (isMovie && currentPlaying){
    const p = getProgress(currentPlaying.key);
    if (p > 1 && p < 98){
      video.addEventListener('loadedmetadata', function once(){
        video.removeEventListener('loadedmetadata', once);
        try { video.currentTime = (p/100) * video.duration; } catch(e){}
      });
    }
  }

  if (window.Hls && Hls.isSupported()){
    hls = new Hls({
      enableWorker:true, lowLatencyMode:!isMovie, backBufferLength:60,
      xhrSetup: ua ? (xhr) => { try { xhr.setRequestHeader('User-Agent', ua); } catch(e){} } : undefined
    });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, (e, d) => {
      $('playerLoader').classList.remove('show');
      if (isMovie) buildQuality(d.levels);
      video.play().catch(()=>{});
    });
    hls.on(Hls.Events.LEVEL_SWITCHED, (e, d) => { if (isMovie) updateQLabel(d.level); });
    hls.on(Hls.Events.ERROR, (e, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
      else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      else {
        $('playerLoader').classList.remove('show');
        $('errorText').textContent = 'Ошибка: ' + d.details;
        $('playerError').classList.add('show');
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = url;
    video.addEventListener('loadedmetadata', () => {
      $('playerLoader').classList.remove('show');
      video.play().catch(()=>{});
    }, { once:true });
  } else {
    $('errorText').textContent = 'Браузер не поддерживает HLS.';
    $('playerError').classList.add('show');
  }
}

function buildQuality(levels){
  const menu = $('qualityMenu');
  menu.innerHTML = '';
  const auto = create('div');
  auto.className = 'opt active'; auto.dataset.level = '-1'; auto.textContent = 'Auto';
  menu.appendChild(auto);
  levels.map((lv, i) => ({lv, i}))
    .sort((a,b) => (b.lv.height||0) - (a.lv.height||0))
    .forEach(({lv, i}) => {
      const o = create('div');
      o.className = 'opt'; o.dataset.level = String(i);
      const h = lv.height || Math.round((lv.bitrate||0)/1000);
      o.textContent = lv.height ? h + 'p' : h + 'k';
      menu.appendChild(o);
    });
  menu.querySelectorAll('.opt').forEach(o => {
    o.addEventListener('click', (e) => {
      e.stopPropagation();
      if (hls) hls.currentLevel = parseInt(o.dataset.level, 10);
      menu.querySelectorAll('.opt').forEach(x => x.classList.remove('active'));
      o.classList.add('active');
      menu.classList.remove('show');
    });
  });
  $('qLabel').textContent = 'Auto';
}
function resetQuality(){
  $('qualityMenu').innerHTML = '';
  $('qualityMenu').classList.remove('show');

}
function updateQLabel(i){
  if (!hls || !hls.levels) return;
  if (hls.autoLevelEnabled){ $('qLabel').textContent = 'Auto'; return; }
  const lv = hls.levels[i];
  if (lv) $('qLabel').textContent = lv.height ? lv.height + 'p' : Math.round((lv.bitrate||0)/1000) + 'k';
}

function seek(e){
  if (currentPlaying?.type === 'channel') return;
  const r = $('progressWrap').getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const ratio = Math.max(0, Math.min(1, x / r.width));
  if (video.duration) video.currentTime = ratio * video.duration;
}

  document.addEventListener('mouseup', up);
});

function initZapBar(){
  $('zapStrip').innerHTML = '';
  zapTiles.length = 0;
  for (let i = 0; i < 5; i++){
    const el = create('div');
    el.className = 'zap-item';
    el.dataset.offset = String(i - 2);
    el.innerHTML = `<div class="zap-logo-wrap"><img class="zap-logo" alt="" loading="lazy"></div>`;
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!zapActive) return;
      const off = parseInt(el.dataset.offset, 10);
      const total = channels.length;
      if (off !== 0){ pendingIndex = (pendingIndex + off + total) % total; updateZapBarContents(); }
      applyZapChannel();
      closeZap();
    });
    $('zapStrip').appendChild(el);
    zapTiles.push({ el, img: el.querySelector('.zap-logo'), lastKey: '' });
  }
}
function updateZapBarContents(){
  const total = channels.length;
  if (!total) return;
  if (pendingIndex < 0) pendingIndex = total - 1;
  if (pendingIndex >= total) pendingIndex = 0;
  pendingChannel = channels[pendingIndex];
  const offsets = [-2, -1, 0, 1, 2];
  for (let i = 0; i < 5; i++){
    const off = offsets[i];
    const idx = (pendingIndex + off + total) % total;
    const ch = channels[idx];
    const t = zapTiles[i];
    t.el.classList.toggle('focus', off === 0);
    t.el.classList.toggle('skipped', skippedChannels.has(idx));
    const url = getChannelLogo(ch);
    const mono = monogramOf(ch.name);
    const key = url ? url : ('m:' + mono);
    if (t.lastKey !== key){
      t.lastKey = key;
      if (url){
        t.img.onload = () => { t.img.style.display = 'block'; t.img.classList.remove('hidden'); };
        t.img.onerror = () => { t.img.style.display = 'none'; t.img.classList.add('hidden'); };
        t.img.style.display = 'block';
        t.img.src = url;
      } else {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5d528d"/><stop offset="1" stop-color="#7c6fb0"/>
          </linearGradient></defs>
          <rect width="100" height="100" rx="20" fill="url(#g)"/>
          <text x="50" y="50" font-family="sans-serif" font-size="44" font-weight="900"
            fill="#fff" text-anchor="middle" dominant-baseline="central">${mono}</text>
        </svg>`;
        t.img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        t.img.style.display = 'block';
        t.img.classList.remove('hidden');
      }
    }
  }
}
function openZap(){
  if (zapActive) return;
  if (currentPlaying?.type !== 'channel') return;
  if (!channelsLoaded || !channels.length) return;
  zapActive = true;
  pendingIndex = currentPlaying.data ? channels.indexOf(currentPlaying.data) : 0;
  if (pendingIndex < 0) pendingIndex = 0;
  skipCount = 0; lastDirection = null;
  updateZapBarContents();
  $('zapBar').classList.add('show');
  clearTimeout(zapTimer);
  zapTimer = setTimeout(closeZap, 5000);
}
function closeZap(){
  zapActive = false;
  $('zapBar').classList.remove('show');
  clearTimeout(zapTimer);
  skipCount = 0; lastDirection = null;
}
function pokeZap(){ if (!zapActive) return; clearTimeout(zapTimer); zapTimer = setTimeout(closeZap, 5000); }
function zapMove(dir){
  if (!zapActive || !channels.length) return;
  const total = channels.length;
  if (lastDirection === dir) skipCount++;
  else { skipCount = 1; lastDirection = dir; }
  if (skipCount >= SKIP_THRESHOLD){
    skippedChannels.add(pendingIndex);
    pendingIndex = (pendingIndex + dir + total) % total;
    skipCount = 0; lastDirection = null;
  } else {
    pendingIndex = (pendingIndex + dir + total) % total;
  }
  updateZapBarContents();
  pokeZap();
}
function applyZapChannel(){
  if (!pendingChannel) return;
  const ch = pendingChannel;
  closeZap();
  currentPlaying = { type:'channel', data: ch, key: channelKey(ch) };
  $('nowName').textContent = ch.name;
  $('nowMeta').textContent = ch.group + ' · ' + getEPG(ch);
  const logo = getChannelLogo(ch);
  if (logo){
    $('nowLogoBox').innerHTML = `<span>${monogramOf(ch.name)}</span><img src="${logo}" onload="this.previousElementSibling.style.display='none'" onerror="this.remove()">`;
  } else {
    $('nowLogoBox').innerHTML = monogramOf(ch.name);
  }
  addToHistory(channelKey(ch));
  loadStream(ch.url, ch.userAgent || '', false);
}

async function fetchPlaylist(url){
  const r = await fetch(url, { cache:'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return parseM3U(await r.text());
}
async function loadChannels(){
  if (channelsLoading) return;
  try {
    const raw = localStorage.getItem(PLAYLIST_CACHE_KEY);
    if (raw){
      const c = JSON.parse(raw);
      if (c.ts && Date.now() - c.ts < PLAYLIST_CACHE_TTL && c.channels?.length){
        channels = c.channels;
        channelsLoaded = true;
        if (activeSection === 'tv') renderTvHome();
        if (activeSection === 'home') renderHome();
        return;
      }
    }
  } catch(e){}

  channelsLoading = true;
  if (activeSection === 'tv') renderTvHome();

  try {
    const all = [];
    for (const url of PLAYLIST_URLS){
      try {
        const p = await fetchPlaylist(url);
        all.push(...p.filter(ch => !isBannedGroup(ch.group) && !ch.isDash));
      } catch(err){ console.warn('Плейлист:', url, err); }
    }
    if (!all.length) throw new Error('Нет каналов');
    channels = dedupChannels(all);
    channelsLoaded = true;
    try { localStorage.setItem(PLAYLIST_CACHE_KEY, JSON.stringify({ ts: Date.now(), channels })); } catch(e){}
    if (activeSection === 'tv') renderTvHome();
    if (activeSection === 'home') renderHome();
  } catch(err){
    console.warn('Ошибка каналов:', err);
  } finally {
    channelsLoading = false;
  }
}

/* =========================================================
   ПОИСК: локальный + API
   ========================================================= */
let suggestItems = [], suggestIdx = -1;
let apiSearchTimer = null;
let apiSearchToken = 0;
let apiResults = [];

function renderSuggestLocal(q){
  const ql = (q||'').trim().toLowerCase();
  let items = [];
  MOVIES.filter(m => m.title.toLowerCase().includes(ql) || m.genres.join(' ').toLowerCase().includes(ql))
    .slice(0, 4)
    .forEach(m => items.push({ type:'movie', data:m, label:m.title, sub:`${m.year} · ${m.genres[0]||''}`, poster:m.poster }));
  if (channelsLoaded){
    channels.filter(c => c.name.toLowerCase().includes(ql) || c.group.toLowerCase().includes(ql))
      .slice(0, 3)
      .forEach(c => items.push({ type:'channel', data:c, label:c.name, sub:c.group, logo:getChannelLogo(c) }));
  }
  return items;
}

function renderSuggestResults(localItems, apiItems, loading){
  suggestItems = [...localItems, ...apiItems];
  suggestIdx = -1;

  const hasAnything = suggestItems.length > 0;
  if (!hasAnything && !loading){
    $('searchSuggest').innerHTML = '<div class="search-suggest__empty">Ничего не найдено</div>';
    $('searchSuggest').classList.add('show');
    return;
  }
  if (!hasAnything && loading){
    $('searchSuggest').innerHTML = '<div class="search-suggest__empty">Идёт поиск по источникам…</div>';
    $('searchSuggest').classList.add('show');
    return;
  }

  const apiLabel = apiItems.length ? `<div style="padding:8px 12px 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700">Из источников (${apiItems.length})</div>` : '';
  const localLabel = localItems.length ? `<div style="padding:8px 12px 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700">В каталоге</div>` : '';

  const renderItem = (it, i) => {
    let thumb;
    if (it.type === 'channel'){
      const mono = monogramOf(it.label);
      thumb = it.logo
        ? `<img src="${it.logo}" onload="this.previousElementSibling.style.display='none'" onerror="this.remove()"><span>${mono}</span>`
        : `<span>${mono}</span>`;
    } else {
      thumb = `<img src="${it.poster}" onerror="this.style.display='none'">`;
    }
    const cls = it.type === 'channel' ? 'search-suggest__logo search-suggest__logo--wide' : 'search-suggest__logo';
    return `
      <div class="search-suggest__item" data-i="${i}">
        <div class="${cls}">${thumb}</div>
        <div class="search-suggest__info">
          <div class="search-suggest__name">${escapeHtml(it.label)}</div>
          <div class="search-suggest__group">${escapeHtml(it.sub||'')}</div>
        </div>
      </div>
    `;
  };

  let idx = 0;
  let html = '';
  if (localItems.length){ html += localLabel + localItems.map(it => renderItem(it, idx++)).join(''); }
  if (apiItems.length){ html += apiLabel + apiItems.map(it => renderItem(it, idx++)).join(''); }

  $('searchSuggest').innerHTML = html;
  $('searchSuggest').classList.add('show');
  $('searchSuggest').querySelectorAll('.search-suggest__item').forEach(el => {
    el.addEventListener('click', () => {
      const it = suggestItems[parseInt(el.dataset.i, 10)];
      $('searchSuggest').classList.remove('show');
      $('search').blur();
      if (!it) return;
      if (it.type === 'channel') openPlayer('channel', it.data);
      else if (it.type === 'api') playFromApi(it.data);
      else openMoviePage(it.data);
    });
  });
}

async function runApiSearch(query, token){
  try {
    const results = await searchByQuery(query);
    if (token !== apiSearchToken) return; // устарел
    apiResults = results;
    const apiItems = results.slice(0, 10).map(v => ({
      type: 'api',
      data: v,
      label: v.title,
      sub: `${v.year || ''} · ${v.sourceName}`,
      poster: v.poster
    }));
    const local = renderSuggestLocal(query);
    renderSuggestResults(local, apiItems, false);
  } catch (e){
    if (token !== apiSearchToken) return;
    apiResults = [];
    const local = renderSuggestLocal(query);
    renderSuggestResults(local, [], false);
  }
}

function handleSearchInput(q){
  const ql = (q||'').trim();
  if (!ql){ $('searchSuggest').classList.remove('show'); suggestItems = []; return; }

  // локальные подсказки сразу
  const local = renderSuggestLocal(ql);
  renderSuggestResults(local, [], true);

  // API-поиск с дебаунсом
  clearTimeout(apiSearchTimer);
  apiSearchToken++;
  const token = apiSearchToken;
  apiSearchTimer = setTimeout(() => {
    runApiSearch(ql, token);
  }, 550);
}

/* Спец-обработка: чистый ID Кинопоиска (только цифры) */
async function handleKinopoiskId(id){
  showToast('Ищу по ID ' + id + '…');
  // Ищем по ID как по названию через источники — они обычно возвращают "Кинопоиск ID"
  // Часть источников поддерживает параметр ids=kinopoisk; проверим оба варианта
  for (const src of VIDEO_SOURCES){
    try {
      const u = `${src.api}?ac=detail&ids=${id}`;
      const r = await fetch(proxyUrl(u), { cache:'no-store' });
      const data = await r.json();
      if (data && data.list && data.list[0]){
        const item = data.list[0];
        const first = (item.vod_play_url || '').split('#')[0];
        const playUrl = first.split('$')[1];
        if (playUrl){
          const m = {
            id: 'api:' + src.id + ':' + item.vod_id,
            title: item.vod_name || ('Фильм #' + id),
            poster: item.vod_pic || '',
            backdrop: item.vod_pic || '',
            year: parseInt(item.vod_year, 10) || 0,
            duration: 0,
            age: '16+',
            rating: parseFloat(item.vod_score) || 7.0,
            genres: (item.vod_class || '').split(',').map(s=>s.trim()).filter(Boolean),
            description: (item.vod_content || '').replace(/<[^>]+>/g,'').trim(),
            url: playUrl,
            isApi: true,
            sourceName: src.name
          };
          openPlayer('movie', m);
          return;
        }
      }
    } catch(e){ /* пробуем следующий источник */ }
  }
  showToast('По ID ничего не найдено');
}

$('search').addEventListener('input', (e) => {
  const q = e.target.value;
  handleSearchInput(q);
});
$('search').addEventListener('focus', () => { if ($('search').value) handleSearchInput($('search').value); });
$('search').addEventListener('keydown', (e) => {
  if (!$('searchSuggest').classList.contains('show')){
    if (e.key === 'Enter'){
      const q = $('search').value.trim();
      if (/^\d{2,9}$/.test(q)){ e.preventDefault(); $('searchSuggest').classList.remove('show'); handleKinopoiskId(q); }
    }
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    suggestIdx = e.key === 'ArrowDown' ? Math.min(suggestItems.length-1, suggestIdx+1) : Math.max(0, suggestIdx-1);
    $('searchSuggest').querySelectorAll('.search-suggest__item').forEach((el,i) => el.classList.toggle('active', i === suggestIdx));
  } else if (e.key === 'Enter'){
    e.preventDefault();
    if (suggestIdx >= 0 && suggestItems[suggestIdx]){
      const it = suggestItems[suggestIdx];
      $('searchSuggest').classList.remove('show');
      $('search').blur();
      if (it.type === 'channel') openPlayer('channel', it.data);
      else if (it.type === 'api') playFromApi(it.data);
      else openMoviePage(it.data);
    } else {
      const q = $('search').value.trim();
      if (/^\d{2,9}$/.test(q)){ $('searchSuggest').classList.remove('show'); handleKinopoiskId(q); }
    }
  } else if (e.key === 'Escape'){
    $('searchSuggest').classList.remove('show');
  }
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.nav-search-wrap')) $('searchSuggest').classList.remove('show');
});

$('logoHome').addEventListener('click', () => {
  stopPlayer();
  activeSection = 'home';
  activeGenre = 'Все';
  $('search').value = '';
  renderNav();
  setView('home');
  renderHome();
});
$('headerBack').addEventListener('click', goBack);
function goBack(){
  if (document.body.classList.contains('view-player')){
    stopPlayer();
    setView('home'); renderHome();
    return;
  }
  if (document.body.classList.contains('view-movie')){
    setView('home');
    renderHome();
  }
}
$('reloadBtn').addEventListener('click', () => {
  try { localStorage.removeItem(PLAYLIST_CACHE_KEY); } catch(e){}
  channelsLoaded = false;
  loadChannels();
  showToast('Плейлисты обновляются…');
});
$('profileBtn').addEventListener('click', (e) => { e.stopPropagation(); $('navProfile').classList.toggle('open'); });
document.addEventListener('click', () => $('navProfile').classList.remove('open'));
$('menuFav').addEventListener('click', () => {
  $('navProfile').classList.remove('open');
  activeSection = 'home'; activeGenre = 'Все';
  renderNav(); setView('home'); renderHome();
  showToast('Избранное');
});
$('menuHist').addEventListener('click', () => {
  $('navProfile').classList.remove('open');
  activeSection = 'home'; activeGenre = 'Все';
  renderNav(); setView('home'); renderHome();
  showToast('История');
});
$('menuRefresh').addEventListener('click', () => {
  $('navProfile').classList.remove('open');
  try { localStorage.removeItem(PLAYLIST_CACHE_KEY); } catch(e){}
  channelsLoaded = false;
  loadChannels();
  showToast('Обновление…');
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (!document.body.classList.contains('view-player')) return;
  if (e.code === 'ArrowLeft' || e.code === 'ArrowRight'){
    if (currentPlaying?.type === 'channel'){
      e.preventDefault();
      if (!zapActive) openZap(); else pokeZap();
      zapMove(e.code === 'ArrowRight' ? 1 : -1);
      return;
    } else {
      e.preventDefault();
      video.currentTime = Math.max(0, Math.min(video.duration||0, video.currentTime + (e.code === 'ArrowRight' ? 5 : -5)));
      pokeUI();
      return;
    }
  }
  if (zapActive && e.code === 'Enter'){ e.preventDefault(); applyZapChannel(); return; }
  if (zapActive && e.code === 'Escape'){ e.preventDefault(); closeZap(); return; }
  if (e.code === 'Escape'){ if (!document.fullscreenElement) goBack(); return; }
  switch (e.code){
    case 'Space': case 'KeyK': e.preventDefault(); togglePlay(); break;
    case 'ArrowUp': e.preventDefault(); video.volume = Math.min(1, video.volume + .05); break;
    case 'ArrowDown': e.preventDefault(); video.volume = Math.max(0, video.volume - .05); break;
    case 'KeyM': $('muteBtn').click(); break;
    case 'KeyF': $('fsBtn').click(); break;
  }
  pokeUI();
});

updateVolUI();
video.volume = 1;
renderProfileSwitcher();
renderNav();
setView('home');
renderHome();
initZapBar();
loadChannels();
</script>
</body>
</html>
