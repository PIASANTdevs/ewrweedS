<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Онлайн-кинотеатр</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
        background: #0b0b0f;
        color: #f5f5f7;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
    }
    .wrap { width: 100%; max-width: 880px; }
    h1 {
        color: #ff9900;
        text-align: center;
        margin: 0 0 24px;
        font-size: clamp(22px, 4vw, 32px);
    }
    .row { display: flex; gap: 10px; margin-bottom: 14px; }
    input {
        flex: 1;
        padding: 14px 18px;
        font-size: 16px;
        color: #fff;
        background: #16161d;
        border: 1px solid #2a2a33;
        border-radius: 10px;
        outline: none;
    }
    input:focus { border-color: #ff9900; }
    button {
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 700;
        color: #1a1a1a;
        background: #ff9900;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        white-space: nowrap;
    }
    button:hover { background: #ffb340; }
    button:active { transform: scale(.98); }
    .msg {
        min-height: 22px;
        margin: 0 0 14px;
        color: #ff6b6b;
        font-size: 14px;
    }
    #player {
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
        display: none;
    }
    #player.visible { display: block; }
    #player iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
    }
    @media (max-width: 560px) {
        .row { flex-direction: column; }
    }
</style>
</head>
<body>
<div class="wrap">
    <h1>🍿 Онлайн-кинотеатр</h1>

    <div class="row">
        <input id="kpId" type="text" inputmode="numeric"
               placeholder="ID фильма с Кинопоиска" value="435">
        <button id="goBtn" type="button">Смотреть</button>
    </div>

    <p class="msg" id="msg"></p>
    <div id="player"></div>
</div>

<!-- Библиотека Kinobox (если не загрузится — сработает резервный путь) -->
<script src="https://kinobox.tv/kinobox.min.js"></script>

<script>
(function () {
    var input = document.getElementById('kpId');
    var btn   = document.getElementById('goBtn');
    var msg   = document.getElementById('msg');
    var box   = document.getElementById('player');

    function setMsg(t) { msg.textContent = t || ''; }

    function normalizeId(raw) {
        var v = String(raw || '').trim();
        if (/^\d{1,9}$/.test(v)) return v;
        var m = v.match(/(?:film|series)\/(\d{1,9})/i) || v.match(/(\d{1,9})/);
        return m ? m[1] : '';
    }

    function play() {
        setMsg('');
        var id = normalizeId(input.value);

        if (!id) {
            setMsg('Введите цифровой ID фильма (например, 435)');
            input.focus();
            return;
        }

        input.value = id;

        // 1. Если библиотека не загрузилась — используем iframe-резерв
        if (typeof kinobox === 'undefined') {
            setMsg('Библиотека Kinobox не загрузилась, открываю через iframe…');
            box.innerHTML = '';
            var iframe = document.createElement('iframe');
            iframe.src = 'https://kinodivbox.netlify.app/?id=' + encodeURIComponent(id);
            iframe.allowFullscreen = true;
            iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media');
            iframe.setAttribute('referrerpolicy', 'origin');
            box.appendChild(iframe);
            box.classList.add('visible');
            return;
        }

        // 2. Основной путь — библиотека Kinobox
        try {
            box.innerHTML = '';
            box.classList.add('visible');
            kinobox(box, {
                search: { kinopoisk: id },
                autoPlay: false
            });
        } catch (e) {
            setMsg('Ошибка плеера: ' + e.message);
            console.error(e);
        }
    }

    btn.addEventListener('click', play);

    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); play(); }
    });

    input.focus();
})();
</script>
</body>
</html>
