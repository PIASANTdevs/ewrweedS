<script>
(function () {
    'use strict';

    // ══════════════════════════════════════════════════════════
    // НАСТРОЙКИ
    // ══════════════════════════════════════════════════════════
    var KINOBOX_SCRIPT_URL = 'https://kino.tatnet.app/kinobox.js';
    var FALLBACK_URL_BASE  = 'https://kinodivbox.netlify.app/?id=';

    // ── Элементы ───────────────────────────────────────────
    var form     = document.getElementById('searchForm');
    var input    = document.getElementById('kpIdField');
    var errorMsg = document.getElementById('errorMsg');
    var player   = document.getElementById('player');

    var kinoboxLoading = false;
    var kinoboxReady   = false;
    var pendingMovieId = null;

    // ── Утилиты ────────────────────────────────────────────
    var isDigits = function (v) { return /^\d{1,9}$/.test(v); };

    function extractId(raw) {
        var value = String(raw).trim();
        if (isDigits(value)) return value;
        var match = value.match(/(?:film|series)\/(\d{1,9})/i) ||
                    value.match(/(\d{1,9})/);
        return match ? match[1] : '';
    }

    function showError(text) {
        errorMsg.textContent = text;
        errorMsg.hidden = false;
        errorMsg.style.animation = 'none';
        void errorMsg.offsetWidth;
        errorMsg.style.animation = '';
        input.focus();
        input.select();
    }

    function clearError() {
        errorMsg.hidden = true;
        errorMsg.textContent = '';
    }

    // ── Динамическая загрузка библиотеки Kinobox ──────────
    function loadKinobox(callback) {
        if (kinoboxReady) {
            callback(true);
            return;
        }

        if (kinoboxLoading) {
            // Уже загружается — подождём
            var check = setInterval(function () {
                if (kinoboxReady || !kinoboxLoading) {
                    clearInterval(check);
                    callback(kinoboxReady);
                }
            }, 100);
            return;
        }

        kinoboxLoading = true;

        var script = document.createElement('script');
        script.src = KINOBOX_SCRIPT_URL;
        script.async = true;

        script.onload = function () {
            kinoboxLoading = false;
            // Проверяем, что функция появилась
            if (typeof kinobox !== 'undefined' || typeof kbox !== 'undefined') {
                kinoboxReady = true;
                callback(true);
            } else {
                callback(false);
            }
        };

        script.onerror = function () {
            kinoboxLoading = false;
            callback(false);
        };

        document.head.appendChild(script);
    }

    // ── Резервный вариант через iframe ─────────────────────
    function playFallback(id) {
        showError('Библиотека Kinobox не загрузилась, открываю через iframe…');

        player.innerHTML = '';
        var iframe = document.createElement('iframe');
        iframe.src = FALLBACK_URL_BASE + encodeURIComponent(id);
        iframe.allowFullscreen = true;
        iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media');
        iframe.setAttribute('referrerpolicy', 'origin');
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = '0';
        player.appendChild(iframe);
        player.classList.add('visible');
    }

    // ── Основной запуск ────────────────────────────────────
    function startMovie(id) {
        pendingMovieId = id;

        loadKinobox(function (ok) {
            if (!ok) {
                playFallback(id);
                return;
            }

            // Библиотека загружена — запускаем
            player.innerHTML = '';
            player.classList.add('visible');

            // Пробуем оба возможных имени функции
            var initFn = (typeof kinobox !== 'undefined') ? kinobox : window.kbox;
            if (typeof initFn === 'function') {
                try {
                    initFn(player, {
                        search: { kinopoisk: id },
                        autoPlay: false
                    });
                } catch (e) {
                    showError('Ошибка плеера: ' + e.message);
                    console.error(e);
                }
            } else {
                showError('Функция Kinobox не найдена после загрузки скрипта.');
            }
        });
    }

    // ── Обработчик кнопки ──────────────────────────────────
    function onSubmit(event) {
        event.preventDefault();
        clearError();

        var raw = input.value.trim();
        if (!raw) {
            showError('Введите ID фильма — например, 435.');
            return;
        }

        var id = extractId(raw);
        if (!id) {
            showError('ID должен состоять из цифр (до 9 знаков) или быть ссылкой на Кинопоиск.');
            return;
        }

        input.value = id;
        startMovie(id);
    }

    form.addEventListener('submit', onSubmit);
    input.addEventListener('input', function () {
        if (!errorMsg.hidden) clearError();
    });

    input.focus();
})();
</script>
